d83475da}}"}];</script><script>(() => {
  'use strict';

  function initialize() {
    const $ = (id) => document.getElementById(id);
    const stage = $('stage');
    if (!stage) return;
    const slides = Array.from(stage.querySelectorAll('section.slide'));
    if (!slides.length) return;
    const overlay = $('overlay');
    const modalBody = $('dialog-body');
    const modalTitle = $('dialog-title');
    const closeButton = $('close-dialog');
    const links = () => Array.isArray(window.lectureLinks) ? window.lectureLinks : [];
    const byKey = (key) => links().find((entry) => entry.key === key);
    const pad = (n) => String(n).padStart(2, '0');
    const interactive = 'a, button, summary, details, input, textarea, select, video, audio, iframe, label, [contenteditable="true"], [role="button"], [role="tab"], [role="slider"]';
    let index = -1;
    let returnFocus = null;
    let swipe = null;
    let suppressClickUntil = 0;

    function make(tag, text, className) {
      const el = document.createElement(tag);
      if (text !== undefined && text !== null) el.textContent = text;
      if (className) el.className = className;
      return el;
    }

    function button(label, className, action) {
      const el = make('button', label, className);
      el.type = 'button';
      el.addEventListener('click', action);
      return el;
    }

    function outsideLink(entry, label, className) {
      const el = make('a', label, className);
      el.href = entry.url;
      el.target = '_blank';
      el.rel = 'noopener noreferrer';
      return el;
    }

    function render(next) {
      if (index === next) return;
      if (overlay.open) overlay.close();
      index = next;
      slides.forEach((slide, i) => {
        slide.hidden = i !== index;
        slide.classList.toggle('is-active', i === index);
      });
      const current = slides[index];
      current.scrollTop = 0;
      stage.scrollTop = 0;
      if (document.scrollingElement) document.scrollingElement.scrollTop = 0;
      document.body.dataset.theme = current.dataset.theme || 'cream';
      $('topic').textContent = current.dataset.chapter || '';
      $('counter').textContent = `${pad(index + 1)} / ${pad(slides.length)}`;
      $('counter').setAttribute('aria-label', `第 ${index + 1} 页，共 ${slides.length} 页`);
      $('prev').disabled = index === 0;
      $('next').disabled = index === slides.length - 1;
      $('progress').style.transform = `scaleX(${(index + 1) / slides.length})`;
    }

    function pageFromHash() {
      const digits = /^#p(\d+)$/.exec(location.hash);
      return digits ? Math.min(slides.length, Math.max(1, Number(digits[1]))) - 1 : 0;
    }

    function goTo(next) {
      if (!Number.isInteger(next) || next < 0 || next >= slides.length) return;
      if (overlay.open) overlay.close();
      render(next);
      const hash = `#p${next + 1}`;
      if (location.hash !== hash) location.hash = hash;
    }

    function modal(title, kind) {
      if (!overlay.open) returnFocus = document.activeElement;
      modalTitle.textContent = title;
      modalBody.replaceChildren();
      modalBody.scrollTop = 0;
      overlay.dataset.view = kind;
      if (!overlay.open) overlay.showModal();
      closeButton.focus({ preventScroll: true });
    }

    overlay.setAttribute('aria-labelledby', 'dialog-title');
    closeButton.addEventListener('click', () => overlay.close());
    overlay.addEventListener('close', () => {
      if (overlay.open) return;
      const target = returnFocus && returnFocus !== document.body && returnFocus.isConnected && !returnFocus.closest('[hidden]') && !returnFocus.disabled ? returnFocus : $('menu');
      returnFocus = null;
      target?.focus({ preventScroll: true });
    });
    let backdropDown = false;
    function outsideRect(event) {
      const rect = overlay.getBoundingClientRect();
      return event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom;
    }
    overlay.addEventListener('pointerdown', (event) => {
      backdropDown = event.target === overlay && outsideRect(event);
    });
    overlay.addEventListener('click', (event) => {
      if (backdropDown && event.target === overlay && outsideRect(event)) overlay.close();
      backdropDown = false;
    });

    function directory() {
      modal('幻灯片目录', 'directory');
      const groups = new Map();
      slides.forEach((slide, i) => {
        const chapter = slide.dataset.chapter || '讲座';
        if (!groups.has(chapter)) {
          const group = make('section', null, 'ld-group');
          group.append(make('h3', chapter, 'ld-group-title'));
          const list = make('div', null, 'ld-list');
          group.append(list);
          modalBody.append(group);
          groups.set(chapter, list);
        }
        const page = button('', 'ld-row ld-slide-link', () => goTo(i));
        if (i === index) page.setAttribute('aria-current', 'page');
        page.append(make('span', pad(i + 1), 'ld-number'), make('span', slide.dataset.title || `第 ${i + 1} 页`));
        groups.get(chapter).append(page);
      });
      const current = modalBody.querySelector('[aria-current="page"]');
      if (current) requestAnimationFrame(() => current.scrollIntoView({block:'nearest'}));
    }

    function notes() {
      const slide = slides[index];
      modal(`讲者备注 · ${pad(index + 1)}`, 'notes');
      const article = make('article', null, 'ld-notes');
      article.append(make('h3', slide.dataset.title || '本页'));
      const source = slide.querySelector('aside.notes');
      if (source && source.textContent.trim()) {
        source.childNodes.forEach((node) => article.append(node.cloneNode(true)));
      } else {
        article.append(make('p', '本页没有单独的讲者备注。'));
      }
      article.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
      modalBody.append(article);
    }

    function resource(key, fromList = false) {
      const entry = byKey(key);
      if (!entry) return;
      modal(entry.label, 'resource');
      const detail = make('div', null, 'ld-resource-detail');
      if (entry.qr) {
        const image = make('img', null, 'ld-qr');
        image.src = entry.qr;
        image.alt = `${entry.label} 的二维码`;
        detail.append(image);
      }
      const link = outsideLink(entry, '打开资源 ↗', 'ld-primary');
      detail.append(link, make('p', entry.url, 'ld-address'));
      if (fromList) detail.append(button('返回资料目录', 'ld-text-action', resources));
      modalBody.append(detail);
    }

    function resources() {
      modal('讲座资料', 'resources');
      const list = make('div', null, 'ld-list ld-resources');
      links().forEach((entry) => {
        const row = entry.qr ? button('', 'ld-row', () => resource(entry.key, true)) : outsideLink(entry, '', 'ld-row');
        row.append(make('span', entry.label), make('span', entry.qr ? '扫码' : '↗', 'ld-arrow'));
        list.append(row);
      });
      modalBody.append(list);
    }

    function zoom(trigger) {
      const original = trigger.querySelector('img');
      if (!original) return;
      modal(trigger.dataset.caption || original.alt || '图片细节', 'image');
      const frame = make('div', null, 'ld-image-frame');
      frame.tabIndex = 0;
      frame.setAttribute('aria-label', '图片查看区');
      const photo = make('img', null, 'ld-photo');
      photo.src = original.currentSrc || original.src;
      photo.alt = original.alt || '';
      photo.draggable = false;
      const toggle = button('放大查看', 'ld-image-toggle', adjust);
      toggle.setAttribute('aria-pressed', 'false');
      function adjust(event) {
        const enlarged = frame.classList.toggle('ld-enlarged');
        toggle.setAttribute('aria-pressed', String(enlarged));
        toggle.textContent = enlarged ? '适应窗口' : '放大查看';
        if (enlarged) {
          const oldRect = photo.getBoundingClientRect();
          const point = event?.target === photo ? [(event.clientX - oldRect.left) / oldRect.width, (event.clientY - oldRect.top) / oldRect.height] : [0.5, 0];
          photo.style.width = `${Math.max(photo.naturalWidth, original.naturalWidth, frame.clientWidth * 1.6)}px`;
          frame.scrollLeft = photo.clientWidth * point[0] - frame.clientWidth / 2;
          frame.scrollTop = photo.clientHeight * point[1] - frame.clientHeight / 2;
        } else {
          photo.style.removeProperty('width');
          frame.scrollTo(0, 0);
        }
      }
      photo.addEventListener('click', adjust);
      frame.append(photo);
      modalBody.append(frame, toggle);
    }

    const fullButton = $('full');
    async function fullscreen() {
      try {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) await document.exitFullscreen();
          else document.webkitExitFullscreen?.();
        } else if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } catch {
        fullButton.title = '当前浏览器未允许全屏';
      }
    }
    function fullStatus() {
      const active = !!(document.fullscreenElement || document.webkitFullscreenElement);
      fullButton.setAttribute('aria-pressed', String(active));
      fullButton.setAttribute('aria-label', active ? '退出全屏' : '进入全屏');
    }
    fullStatus();
    document.addEventListener('fullscreenchange', fullStatus);
    document.addEventListener('webkitfullscreenchange', fullStatus);
    fullButton.addEventListener('click', fullscreen);
    $('prev').addEventListener('click', () => goTo(index - 1));
    $('next').addEventListener('click', () => goTo(index + 1));
    $('menu').addEventListener('click', directory);
    $('notebtn').addEventListener('click', notes);
    $('resources').addEventListener('click', resources);

    stage.querySelectorAll('a[href^="http"]').forEach((anchor) => { anchor.target = '_blank'; anchor.rel = 'noopener noreferrer'; });
    stage.addEventListener('click', (event) => {
      if (event.defaultPrevented || event.button !== 0 || performance.now() < suppressClickUntil || overlay.open) return;
      const target = event.target;
      const resourceButton = target.closest('button[data-resource]');
      if (resourceButton) { resource(resourceButton.dataset.resource); return; }
      const imgButton = target.closest('button.zoom');
      if (imgButton) { zoom(imgButton); return; }
      const jump = target.closest('button[data-jump]');
      if (jump) { goTo(Number(jump.dataset.jump) - 1); return; }
      if (target.closest(interactive) || !target.closest('.slide.is-active') || window.getSelection()?.toString()) return;
      goTo(index + 1);
    });

    stage.addEventListener('touchstart', (event) => {
      if (event.touches.length !== 1 || event.target.closest(interactive)) { swipe = null; return; }
      const {clientX:x, clientY:y} = event.touches[0];
      swipe = {x, y};
    }, {passive: true});
    stage.addEventListener('touchcancel', () => { swipe = null; }, {passive: true});
    stage.addEventListener('touchend', (event) => {
      if (!swipe || !event.changedTouches.length) return;
      const {clientX, clientY} = event.changedTouches[0];
      const dx = clientX - swipe.x;
      const dy = clientY - swipe.y;
      swipe = null;
      if (Math.abs(dx) > 16 || Math.abs(dy) > 16) suppressClickUntil = performance.now() + 450;
      if (Math.abs(dx) >= 55 && Math.abs(dx) > Math.abs(dy) * 1.6 && !window.getSelection()?.toString()) goTo(index + (dx < 0 ? 1 : -1));
    }, {passive: true});

    document.addEventListener('keydown', (event) => {
      if (event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.isComposing || overlay.open) return;
      const target = event.target;
      if (target instanceof Element && target.closest('input, textarea, select, [contenteditable="true"], [role="textbox"], video, audio')) return;
      const k = event.key.toLowerCase();
      if (k === ' ' && target instanceof Element && target.closest(interactive)) return;
      const actions = {
        arrowleft: () => goTo(index - 1), arrowup: () => goTo(index - 1), pageup: () => goTo(index - 1),
        arrowright: () => goTo(index + 1), arrowdown: () => goTo(index + 1), pagedown: () => goTo(index + 1),
        ' ': () => goTo(index + (event.shiftKey ? -1 : 1)), home: () => goTo(0), end: () => goTo(slides.length - 1),
        m: directory, n: notes, r: resources, f: fullscreen
      };
      if (actions[k]) { event.preventDefault(); if (!event.repeat) actions[k](); }
    });
    window.addEventListener('hashchange', () => render(pageFromHash()));
    render(pageFromHash());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize, {once:true});
  else initialize();
})();

/* 封面页：鼠标静止 3 秒后，底部工具栏淡出；移动鼠标或按 Tab 时回来 */
(() => {
