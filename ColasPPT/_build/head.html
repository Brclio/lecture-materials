:root {
  --serif: 'Lecture Song','Noto Serif SC','Songti SC','STSong',SimSun,serif;
  --sans: 'Noto Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;

}
* { box-sizing:border-box }
body,[data-theme="cream"] { --page:#f9f6eb;--fg:#172736;--muted:#535b5a;--accent:#175d9d;--rule:#a5a8a0;--soft:#eeeadc;--spot:#f4d758;--mark:#e54c45 }
[data-theme="blue"] { --page:#164f83;--fg:#fff5d9;--muted:#dfebef;--accent:#f4d758;--rule:#7493aa;--soft:#184574;--spot:#3b6f94;--mark:#f4d758 }
[data-theme="ink"] { --page:#182c3b;--fg:#fff5d9;--muted:#dae1df;--accent:#f4d758;--rule:#6e818b;--soft:#253e4f;--spot:#315267;--mark:#f4d758 }
[data-theme="gold"] { --page:#f5df86;--fg:#202e37;--muted:#464c49;--accent:#164e82;--rule:#958c60;--soft:#f7e9b2;--spot:#f9edbd;--mark:#b04137 }
html,body { margin:0;width:100%;height:100%;overflow:hidden }
body { color:var(--fg);background:var(--page);font-family:var(--sans);line-height:1.5 }
button,a { font:inherit;color:inherit;-webkit-tap-highlight-color:transparent }
button { cursor:pointer }
button:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid var(--blue);outline-offset:4px }

h1,h2,h3,p,figure { margin:0 }
a { text-decoration:none }
[hidden] { display:none!important }
.frame { width:min(100%,180vh,1750px); height:100%;height:100dvh; margin-inline:auto;display:grid;grid-template-rows:clamp(48px,8.8vh,90px) minmax(0,1fr) clamp(49px,8.5vh,80px);padding:0 clamp(26px,4.2vw,82px) }
.mast { display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--fg);gap:1em }
.mastinfo,.toolbar,.navkeys,.edition {display:flex;align-items:center}

main {min-width:0;min-height:0;overflow:hidden;position:relative}

.blurb,.smallpara,.flow p,.row p,.routegrid p,.comparegrid article>p,.memorygrid p,.toolchoice p,.editorialpair p,.testprompt p,.comiccaptions p,.samplecopy p,.qritem p {font-size:clamp(17px,calc(var(--u)*1.65),28px);color:var(--muted);line-height:1.65;text-wrap:pretty}

.builder-route, .builder-shift, .builder-index {
  width: 100%;
  min-width: 0;
  margin: 0;
  color: var(--ink, #1a1a2e);
  line-height: 1.35;
  text-align: left;
}
.builder-route *, .builder-shift *, .builder-index * { box-sizing: border-box; }
.builder-route {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  column-gap: clamp(20px, 3.5vw, 56px);
  padding: 0;
  list-style: none;
}
.builder-stage { min-width: 0; margin: 0; padding: 0; }
.builder-stage-visual {
  position: relative;
  display: flex;
  align-items: center;
  height: clamp(70px, 7.5vw, 104px);
  margin-bottom: clamp(10px, 1.1vw, 18px);
}
.builder-stage:not(:last-child) .builder-stage-visual::after {
  content: "";
  position: absolute;
  top: 52%;
  right: 0;
  left: clamp(108px, 10.4vw, 154px);
  height: 2px;
  background: var(--blue-deep, #1e5ba8);
  opacity: .74;
}
.builder-stage:not(:last-child) .builder-stage-visual::before {
  content: "";
  position: absolute;
  top: calc(52% - 4px);
  right: 0;
  width: 9px;
  height: 9px;
  border: solid var(--blue-deep, #1e5ba8);
  border-width: 2px 2px 0 0;
  transform: rotate(45deg);
}
.builder-symbol {
  display: block;
  height: 100%;
  width: auto;
  max-width: 100px;
  color: var(--blue-deep, #1e5ba8);
}
.builder-stage-label {
  display: block;
  margin: 0 0 .35em;
  color: var(--blue-deep, #1e5ba8);
  font-weight: 650;
  font-size: clamp(15px, 1.33vw, 19px);
  letter-spacing: .09em;
}
.builder-stage-title {
  display: block;
  font-family: var(--serif, "Songti SC", serif);
  font-size: clamp(25px, 3.05vw, 49px);
  font-weight: 800;
  line-height: 1.16;
}
.builder-stage-copy {
  max-width: 17em;
  margin: .7em 0 0;
  color: inherit;
  font-size: clamp(18px, 1.7vw, 27px);
  line-height: 1.55;
}
.builder-shift {
  display: grid;
  grid-template-columns: 1.17fr 1fr;
  gap: clamp(18px, 2vw, 36px);
}
.builder-change {
  margin: 0;
  padding: clamp(18px, 2.5vw, 40px);
  border-radius: 0;
}
.builder-change-hard {
  color: #123f67;
  background: #f3e6b1;
}
.builder-change-easy {
  background: #164c75;
  color: #fff8e6;
}
.builder-change-heading {
  display: flex;
  align-items: center;
  gap: clamp(10px, 1.2vw, 20px);
  margin: 0 0 clamp(14px, 1.6vw, 25px);
}
.builder-change-mark {
  display: grid;
  place-items: center;
  width: 1.2em;
  height: 1.2em;
  border: 1.5px solid currentColor;
  border-radius: 50%;
  font: 500 clamp(23px, 2.4vw, 37px)/1 system-ui, sans-serif;
}
.builder-change-term {
  font: 800 clamp(29px, 3.1vw, 49px)/1.15 var(--serif, "Songti SC", serif);
}
.builder-change-items { margin: 0; }
.builder-change-items > div {
  display: grid;
  grid-template-columns: 2.3em 1fr;
  align-items: baseline;
  gap: clamp(12px, 1.4vw, 22px);
  margin: 0;
  padding: .58em 0;
  border-top: 1px solid currentColor;
  font-size: clamp(17px, 1.65vw, 26px);
  line-height: 1.45;
}
.builder-change-items dt { margin: 0; font-weight: 750; }
.builder-change-items dd { margin: 0; color: inherit; }
.builder-index { padding: 0; }
.builder-entry {
  display: grid;
  grid-template-columns: 1fr 1.16fr;
  align-items: baseline;
  gap: clamp(18px, 2.8vw, 48px);
  padding: clamp(13px, 1.3vw, 22px) 0;
  border-bottom: 1px solid #aca894;
}
.builder-entry:first-child { border-top: 2px solid var(--blue-deep, #1e5ba8); }
.builder-entry-term {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0,1fr) 5.15em;
  align-items: baseline;
  gap: 8px;
  margin: 0;
  color: var(--ink, #1a1a2e);
  font-size: clamp(19px, 1.85vw, 28px);
  line-height: 1.1;
}
.builder-entry-term span {
  color: var(--blue-deep, #1e5ba8);
  font: italic 550 clamp(26px, 3.35vw, 54px)/1.15 Georgia, "Times New Roman", serif;
  letter-spacing: -.035em;
}
.builder-entry-term strong {
  font-family: var(--serif, "Songti SC", serif);
  font-weight: 800;
}
.builder-entry-copy {
  margin: 0;
  font-size: clamp(17px, 1.62vw, 25px);
  line-height: 1.45;
}
@media (max-width: 900px) {
  .builder-entry { grid-template-columns: .84fr 1fr; }
  .builder-entry-term { grid-template-columns: 1fr; gap: .3em; }
}
@media (max-width: 650px) {
  .builder-route { grid-template-columns: 1fr; gap: 18px; }
  .builder-stage {
    display: grid;
    grid-template-columns: 64px 1fr;
    grid-template-rows: auto auto auto;
    column-gap: 14px;
    align-content: start;
  }
  .builder-stage-visual {
    grid-column: 1;
    grid-row: 1 / 4;
    align-self: start;
    margin: 0;
    height: 58px;
  }
  .builder-stage:not(:last-child) .builder-stage-visual::after,
  .builder-stage:not(:last-child) .builder-stage-visual::before { display: none; }
  .builder-symbol { width: 100%; }
  .builder-stage-label, .builder-stage-title, .builder-stage-copy { grid-column: 2; }
  .builder-stage-label { font-size: 13px; }
  .builder-stage-title { font-size: 25px; }
  .builder-stage-copy { margin-top: .28em; max-width: none; font-size: 16px; line-height: 1.45; }
  .builder-shift { grid-template-columns: 1fr; gap: 12px; }
  .builder-change { padding: 16px 18px 10px; }
  .builder-change-heading { margin-bottom: 10px; }
  .builder-change-term { font-size: 25px; }
  .builder-change-mark { font-size: 21px; }
  .builder-change-items > div { font-size: 16px; }
  .builder-entry { grid-template-columns: 1fr; gap: 7px; padding: 13px 0; }
  .builder-entry-term {
    display: flex;
    align-items: baseline;
    gap: 13px;
    font-size: 17px;
  }
  .builder-entry-term span { font-size: 28px; }
  .builder-entry-copy { font-size: 16px; }
}
